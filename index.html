<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101318">
  <title>Race to 1000</title>
  <link rel="manifest" href="manifest.json">
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#101318;color:#fff}
    main{max-width:520px;margin:auto;padding:22px 16px 40px}
    h1{font-size:28px;margin:8px 0 2px}.sub{color:#aeb7c4;margin:0 0 24px}
    .card{background:#1a1f27;border:1px solid #303846;border-radius:20px;padding:18px;margin:14px 0}
    .top{display:flex;justify-content:space-between;align-items:center;gap:12px}.name{font-weight:750;font-size:18px}
    .goals{font-size:44px;font-weight:850;line-height:1}.muted{color:#aeb7c4;font-size:14px}
    .bar{height:12px;background:#303846;border-radius:999px;overflow:hidden;margin:14px 0 8px}.fill{height:100%;background:#e8edf5}
    .stats{display:flex;justify-content:space-between;gap:12px;margin-top:8px}
    .gap{text-align:center;padding:16px}.gap strong{font-size:26px}
    footer{text-align:center;color:#8792a2;font-size:12px;margin-top:22px}
  </style>
</head>
<body>
<main>
  <h1>⚽ Race to 1,000</h1>
  <p class="sub">Messi vs Ronaldo • Official senior competitive goals</p>

  <section class="card">
    <div class="top"><div><div class="name">🇵🇹 Cristiano Ronaldo</div><div class="muted">Road to 1,000</div></div><div class="goals" id="rGoals">979</div></div>
    <div class="bar"><div class="fill" id="rBar"></div></div>
    <div class="stats"><span class="muted" id="rPct"></span><strong id="rRemain"></strong></div>
  </section>

  <section class="card">
    <div class="top"><div><div class="name">🇦🇷 Lionel Messi</div><div class="muted">Road to 1,000</div></div><div class="goals" id="mGoals">929</div></div>
    <div class="bar"><div class="fill" id="mBar"></div></div>
    <div class="stats"><span class="muted" id="mPct"></span><strong id="mRemain"></strong></div>
  </section>

  <section class="card gap">
    <div class="muted">Current career-goal gap</div>
    <strong id="gap"></strong>
    <div class="muted">goals</div>
  </section>

  <footer>Starter PWA • Automatic verified-data connection comes next</footer>
</main>
<script>
  const data={ronaldo:979,messi:929,target:1000};
  function player(prefix,value){
    document.getElementById(prefix+"Goals").textContent=value;
    document.getElementById(prefix+"Bar").style.width=Math.min(100,value/data.target*100)+"%";
    document.getElementById(prefix+"Pct").textContent=(value/data.target*100).toFixed(1)+"% complete";
    document.getElementById(prefix+"Remain").textContent=(data.target-value)+" remaining";
  }
  player("r",data.ronaldo); player("m",data.messi);
  document.getElementById("gap").textContent=Math.abs(data.ronaldo-data.messi);
  if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
</body>
</html>
